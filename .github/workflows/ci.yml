name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check (host and client bundles)
        run: |
          node --check lib/index.js
          node --check lib/client.js
      - name: Package and bundle-patch sanity
        run: |
          node -e "const p=require('./package.json'); if(p.name!=='dsh-token-usage') throw new Error('unexpected package name'); console.log(p.name, p.version)"
          node -e "const fs=require('fs'); const y=fs.readFileSync('cordis.patch.yml','utf8'); if(!y.includes('dsh-token-usage')) throw new Error('bundle patch does not name the package'); console.log('bundle patch ok')"
      - name: Vendored peer dependency is present
        run: |
          test -f node_modules/schemastery/package.json
          test -f node_modules/cosmokit/package.json
          test -f node_modules/@standard-schema/spec/package.json
          echo "vendored schemastery ok"
